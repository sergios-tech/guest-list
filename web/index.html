<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c2d12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Guest List</title>
    <!-- Google Identity Services — powers the "Continue with Google" button on
         the login page (web/src/components/GoogleLoginButton.tsx).
         No Subresource Integrity (integrity=) on purpose: GIS is a versionless,
         frequently-updated script and Google does not publish a stable hash for
         it. Pinning one would break login the next time Google ships an update.
         This is the exact tag from Google's official docs. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
