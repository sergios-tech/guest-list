services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guests}
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?must be set in .env, generate with openssl rand -base64 24}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-guests}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: throttler counters are short-lived; surviving an api
    # restart matters, surviving a Redis restart does not.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      # Discrete env vars (not DATABASE_URL) so passwords containing @, :, /
      # etc. don't get reinterpreted as authority components by a URI parser.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-guests}
      DB_USER: ${POSTGRES_USER:-dbuser}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?must be set in .env, generate with openssl rand -base64 24}"
      JWT_SECRET: "${JWT_SECRET:?must be set in .env, generate with openssl rand -base64 48}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  web:
    build: ./web
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        # Gate nginx on api being healthy — Nest takes ~3-8s to boot
        # (TypeORM, route registration), and starting nginx earlier means
        # the first user hits a 502 until the api is actually serving.
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
