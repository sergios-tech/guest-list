services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guests}
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?must be set in .env, generate with openssl rand -base64 24}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-guests}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: throttler counters are short-lived; surviving an api
    # restart matters, surviving a Redis restart does not.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      # Discrete env vars (not DATABASE_URL) so passwords containing @, :, /
      # etc. don't get reinterpreted as authority components by a URI parser.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-guests}
      DB_USER: ${POSTGRES_USER:-dbuser}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?must be set in .env, generate with openssl rand -base64 24}"
      JWT_SECRET: "${JWT_SECRET:?must be set in .env, generate with openssl rand -base64 48}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      REDIS_URL: redis://redis:6379
      # Set this to the public origin(s) in prod (e.g. https://guests.sergiotech.com).
      # The localhost defaults exist only for `docker compose up` on a dev laptop.
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}"
      PORT: "3000"
      # Google Sheets sync (Dashboard "Sync from Google Sheet" button).
      # Required: provision an OAuth client at console.cloud.google.com →
      # APIs & Services → Credentials → OAuth client ID (Web application).
      # Authorized redirect URI must match GOOGLE_OAUTH_REDIRECT_URI.
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      GOOGLE_OAUTH_REDIRECT_URI: "${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/api/google-sync/oauth/callback}"
      # AES-256-GCM key for refresh-token-at-rest encryption.
      # Generate with: openssl rand -hex 32  (must be 64 hex chars).
      GOOGLE_TOKEN_ENC_KEY: "${GOOGLE_TOKEN_ENC_KEY:?must be set in .env, generate with openssl rand -hex 32}"
      # The sheet to read from. Defaults to the production wedding sheet.
      GOOGLE_SHEET_ID: "${GOOGLE_SHEET_ID:-1gsydyLPpQH3bJoppdZoLYjlq3zKexlc-qWnuYnujeQM}"
      GOOGLE_SHEET_TAB: "${GOOGLE_SHEET_TAB:-Pozivnice}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  web:
    build: ./web
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # Stable container name so the sergio-tech nginx-proxy can reach us by
    # hostname over the shared external network (see networks.proxy below).
    container_name: guest-list-nginx
    restart: unless-stopped
    # No host port binding in prod — only the sergio-tech nginx-proxy talks to us
    # via the shared docker network. For local laptop dev, override with
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    # or temporarily add a `ports:` block.
    expose:
      - "80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - proxy
    depends_on:
      api:
        # Gate nginx on api being healthy — Nest takes ~3-8s to boot
        # (TypeORM, route registration), and starting nginx earlier means
        # the first user hits a 502 until the api is actually serving.
        condition: service_healthy
      web:
        condition: service_started

networks:
  default:
  # External network created by /home/ubuntu/sergio-tech/docker-compose.yml.
  # Joining it lets sergio-tech's nginx-proxy resolve `guest-list-nginx` by
  # hostname and route guests.sergiotech.com traffic to us. Created with
  #   docker network create sergio-tech_proxy
  # (or auto-created by `docker compose up` in /home/ubuntu/sergio-tech).
  proxy:
    external: true
    name: sergio-tech_proxy

volumes:
  pgdata:
